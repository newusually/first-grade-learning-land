<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>看图学应用 · 一年级数学</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
         background: linear-gradient(160deg,#aee3ff 0%,#d8f7e3 55%,#fff3c9 100%); overflow-x: hidden;
         color: #333; display: flex; flex-direction: column; align-items: center; }

  /* ---- 动态背景装饰 ---- */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .sun { position: absolute; top: 4%; right: 6%; font-size: 52px; animation: spin 26s linear infinite; }
  .cloud { position: absolute; font-size: 34px; opacity: .85; animation: drift linear infinite; }
  .c1 { top: 10%; animation-duration: 44s; }
  .c2 { top: 26%; font-size: 26px; animation-duration: 60s; animation-delay: -20s; }
  .butterfly { position: absolute; font-size: 24px; animation: fly 18s ease-in-out infinite; }
  .grass { position: fixed; left: 0; right: 0; bottom: 0; height: 34px; font-size: 22px; line-height: 34px;
           white-space: nowrap; overflow: hidden; z-index: 0; opacity: .9; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift { from { left: -8%; } to { left: 108%; } }
  @keyframes fly { 0%{transform:translate(0,0) rotate(0)} 25%{transform:translate(30vw,-30px) rotate(8deg)}
                   50%{transform:translate(55vw,20px) rotate(-6deg)} 75%{transform:translate(25vw,-20px) rotate(5deg)}
                   100%{transform:translate(0,0) rotate(0)} }

  header { z-index: 2; width: 100%; max-width: 920px; padding: 12px 16px 4px;
           display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 22px; color: #2b6cb0; letter-spacing: 2px; text-shadow: 0 2px 0 #fff; flex: 1; }
  .btn { border: none; border-radius: 999px; padding: 8px 16px; font-size: 14px; cursor: pointer;
         font-family: inherit; color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.15); transition: transform .15s; }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .btn.home { background: linear-gradient(#8ec5ff,#5a9ee8); }
  .btn.spk  { background: linear-gradient(#ffd36e,#f5a623); }
  .score { background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700;
           color: #e67e22; box-shadow: 0 2px 6px rgba(0,0,0,.08); }

  .bar { z-index: 2; width: 100%; max-width: 920px; padding: 4px 16px 10px; display: flex; gap: 8px;
         flex-wrap: wrap; align-items: center; }
  .bar .lv { padding: 7px 14px; border-radius: 999px; border: 2px solid #7fb3e0; background: #fff;
             cursor: pointer; font-size: 13.5px; font-weight: 700; color: #2b6cb0; }
  .bar .lv.on { background: #4aa3e8; color: #fff; border-color: #2b7cc0; animation: pop .3s; }
  .prog { margin-left: auto; font-size: 13px; color: #555; background: #ffffffaa; padding: 6px 12px;
          border-radius: 999px; }
  @keyframes pop { 50% { transform: scale(1.18); } }

  /* ---- 题卡 ---- */
  .stage { z-index: 2; width: 100%; max-width: 920px; flex: 1; padding: 6px 16px 90px; }
  .card { background: rgba(255,255,255,.93); border-radius: 22px; box-shadow: 0 10px 30px rgba(60,100,160,.18);
          padding: 22px 24px 20px; margin: 0 auto; max-width: 640px; animation: cardIn .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes cardIn { from { transform: translateY(50px) scale(.9); opacity: 0; } }
  .card.shake { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-9px); } 40%,80% { transform: translateX(9px); } }
  .qno { display: inline-block; background: #ffe3b3; color: #b4690e; font-weight: 700; font-size: 12px;
         border-radius: 999px; padding: 3px 12px; margin-bottom: 10px; }
  .qtext { font-size: 18px; line-height: 1.65; text-indent: 2em; margin-bottom: 6px; }
  .qtext b { color: #e74c3c; font-size: 20px; }
  .scene { min-height: 130px; display: flex; flex-direction: column; justify-content: center;
           align-items: center; gap: 6px; margin: 8px 0 4px; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 34px; }
  .em { font-size: 30px; display: inline-block; animation: drop .45s cubic-bezier(.2,1.6,.4,1) backwards;
        transition: all .4s; }
  .em.idle { animation: drop .45s backwards, sway 2.6s ease-in-out .5s infinite; }
  @keyframes drop { from { transform: translateY(-60px) scale(.3); opacity: 0; } }
  @keyframes sway { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
  .em.gone { filter: grayscale(1); opacity: .45; transform: scale(.85); }
  .em.gone::after { content: "✕"; position: absolute; font-size: 24px; color: #e74c3c; font-weight: 900; }
  .em.lit { transform: scale(1.35) translateY(-6px); filter: drop-shadow(0 0 8px gold); }
  .em.dim { opacity: .35; }
  .em.unknown { outline: 2px dashed #bbb; border-radius: 8px; }
  .op { font-size: 26px; font-weight: 900; color: #e74c3c; align-self: center; margin: 0 6px;
        animation: drop .4s backwards; }
  .brace { width: 46%; height: 16px; border: 3px solid #555; border-top: none;
           border-radius: 0 0 40px 40px; animation: grow .6s .3s backwards; }
  @keyframes grow { from { width: 0; opacity: 0; } }
  .cap { font-size: 14px; font-weight: 700; }
  .cap.q { color: #e67e22; }
  .tag { font-size: 13px; color: #777; margin: 2px 0 6px; }

  .answer { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .answer input { width: 96px; height: 46px; font-size: 24px; text-align: center; border: 3px solid #7fb3e0;
                  border-radius: 12px; font-weight: 700; color: #2b6cb0; outline: none; }
  .answer input:focus { border-color: #f5a623; box-shadow: 0 0 0 4px #ffe9c2; }
  .answer input.ok { border-color: #2ecc71; background: #eafff2; }
  .answer input.no { border-color: #e74c3c; background: #ffefef; animation: shake .4s; }
  .eqshow { font-size: 20px; font-weight: 900; color: #8e44ad; letter-spacing: 2px; min-height: 26px;
            margin-top: 10px; text-align: center; }
  .eqshow.show { animation: pop .4s; }
  .verdict { text-align: center; font-size: 19px; font-weight: 900; min-height: 28px; margin-top: 6px; }
  .verdict.good { color: #27ae60; animation: pop .4s; }
  .verdict.bad { color: #e74c3c; }
  .bigbtn { font-size: 17px; padding: 11px 34px; background: linear-gradient(#5fd68a,#2eaf62); }
  .bigbtn.next { background: linear-gradient(#7db9ff,#3f8fe0); }
  .bigbtn:disabled { filter: grayscale(.7); cursor: default; }
  .ctr { text-align: center; margin-top: 8px; }

  /* ---- 结算 ---- */
  .done { text-align: center; padding: 40px 20px; }
  .done .medal { font-size: 70px; animation: pop .6s; }
  .done h2 { color: #e67e22; margin: 10px 0; }
  .done p { color: #666; margin-bottom: 18px; }
  .stars { font-size: 34px; letter-spacing: 8px; margin-bottom: 14px; }

  /* 彩带 */
  .confetti { position: fixed; top: -30px; z-index: 99; font-size: 22px; pointer-events: none;
              animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .8; } }
</style>
</head>
<body>
<div class="sky">
  <div class="sun">☀️</div>
  <div class="cloud c1">☁️</div>
  <div class="cloud c2">☁️</div>
  <div class="butterfly">🦋</div>
</div>
<div class="grass">🌿🌷🌿🌸🌿🌼🌿🌷🌿🌿🌸🌿🌼🌿🌷🌿🌸🌿🌼🌿🌿🌷🌿🌸</div>

<header>
  <h1>📐 看图学应用</h1>
  <span class="score">⭐ <span id="sc">0</span> 分</span>
  <button class="btn spk" id="spkBtn">🔊 朗读题目</button>
  <button class="btn home" onclick="location.href='index.html'">🏠 主页</button>
  <button class="btn home" onclick="location.href='口算动画课堂.html'">🎬 动画课堂</button>
</header>

<div class="bar">
  <button class="lv on" data-lv="1">① 10以内</button>
  <button class="lv" data-lv="2">② 20以内不进位</button>
  <button class="lv" data-lv="3">③ 进位退位挑战</button>
  <button class="lv" data-lv="0">🎲 混合闯关</button>
  <span class="prog">第 <span id="cur">1</span> / 10 题</span>
</div>

<div class="stage">
  <div class="card" id="card">
    <div class="qno" id="qno">第 1 题</div>
    <div class="qtext" id="qtext"></div>
    <div class="tag">👆 先听题目，再看图说一说，最后填答案</div>
    <div class="scene" id="scene"></div>
    <div class="answer">
      <input id="inp" type="number" inputmode="numeric" placeholder="？" autocomplete="off">
      <button class="btn bigbtn" id="okBtn">✔ 检查</button>
      <button class="btn bigbtn next" id="nxBtn" style="display:none">下一题 ▶</button>
    </div>
    <div class="eqshow" id="eq"></div>
    <div class="verdict" id="vd"></div>
  </div>
</div>

<script>
/* ================= AJAX：优先加载外部题库 ./题库/看图应用题.json ================= */
let EXT = null;
fetch('./题库/看图应用题.json').then(r => r.ok ? r.json() : Promise.reject()).then(j => { EXT = j; }).catch(()=>{});

/* ================= 语音 ================= */
let voice = null;
function pickVoice(){ const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>v.lang.startsWith('zh') && /Xiaoxiao|Yunxi|Huihui|Yaoyao/.test(v.name))
       || vs.find(v=>v.lang.startsWith('zh')) || null; }
pickVoice(); speechSynthesis.onvoiceschanged = pickVoice;
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,''));
  u.lang='zh-CN'; if(voice) u.voice=voice; u.rate=.95; u.pitch=1.15; speechSynthesis.speak(u);}catch(e){} }

/* ================= 彩带 ================= */
function confetti(n=26){ const es=['🎉','⭐','🌟','✨','🎊','🎈'];
  for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='confetti';
    d.textContent=es[Math.random()*es.length|0]; d.style.left=Math.random()*100+'vw';
    d.style.animationDuration=(1.6+Math.random()*1.6)+'s'; d.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),3800); } }

/* ================= 题库模板 ================= */
const T_ADD=[["树上有 {a} 只小鸟，又飞来 {b} 只，现在一共有多少只？","🐦","只"],
["盘子里有 {a} 个苹果，妈妈又放进 {b} 个，一共有多少个？","🍎","个"],
["花坛里有 {a} 朵红花，还有 {b} 朵黄花，一共有多少朵？","🌸","朵"],
["小明有 {a} 支铅笔，又买了 {b} 支，现在一共有多少支？","✏️","支"],
["停车场有 {a} 辆车，又开来 {b} 辆，一共有多少辆？","🚗","辆"],
["小猴摘了 {a} 个桃子，又摘了 {b} 个，一共摘了多少个？","🍑","个"],
["小兔拔了 {a} 根萝卜，又拔了 {b} 根，一共拔了多少根？","🥕","根"]];
const T_SUB=[["树上有 {a} 只小鸟，飞走了 {b} 只，树上还剩多少只？","🐦","只"],
["盘子里有 {a} 个苹果，吃了 {b} 个，还剩多少个？","🍎","个"],
["停车场有 {a} 辆车，开走了 {b} 辆，还剩多少辆？","🚗","辆"],
["小明有 {a} 支铅笔，送给同学 {b} 支，还剩多少支？","✏️","支"],
["池塘里有 {a} 条小鱼，游走了 {b} 条，还剩多少条？","🐟","条"],
["小明有 {a} 颗糖，送给妹妹 {b} 颗，还剩多少颗？","🍬","颗"]];
const T_ADD2=[["树上原来有 {a} 只小鸟，先飞来 {b} 只，又飞来 {c} 只，现在一共有多少只？","🐦","只"],
["盘子里有 {a} 个苹果，妈妈放进 {b} 个，奶奶又放进 {c} 个，一共有多少个？","🍎","个"],
["小红跳绳 {a} 下，小刚跳 {b} 下，小明跳 {c} 下，三人一共跳了多少下？","🤸","下"]];
const T_SUB2=[["树上有 {a} 只小鸟，先飞走 {b} 只，又飞走 {c} 只，还剩多少只？","🐦","只"],
["篮子里有 {a} 个鸡蛋，早上用了 {b} 个，中午又用了 {c} 个，还剩多少个？","🥚","个"],
["停车场有 {a} 辆车，先开走 {b} 辆，又开走 {c} 辆，还剩多少辆？","🚗","辆"]];
const FRUITS=[["🍎","苹果"],["🍐","梨"],["🍊","橘子"],["🍋","柠檬"],["🍇","葡萄"],["🍓","草莓"],["🍌","香蕉"],["🍉","西瓜"],["🍑","桃子"]];
const PRAISE=["答对啦，真棒！","太厉害了！","你真是数学小天才！","完全正确！","好聪明呀！"];
const CHEER=["没关系，再想一想哦。","差一点点，加油！","再仔细看看图哦。"];

const R=(x,y)=>Math.floor(Math.random()*(y-x+1))+x;
const pick=a=>a[Math.random()*a.length|0];

/* 各题型生成器：返回 {text, scene(steps), ans, eq, unit} */
function gAdd(lv){ const [t,e,u]=pick(T_ADD);
  let a,b;
  if(lv===1){ a=R(2,8); b=R(2,8); if(a+b>10) return null; }
  else if(lv===2){ a=R(10,15); b=R(2,9-a%10); }
  else { a=R(4,9); b=R(4,9); if(a+b<11||a+b>18) return null; }
  return { kind:'add', text:t.replace('{a}',a).replace('{b}',b), ans:a+b,
           eq:`${a}＋${b}＝${a+b}`, a,b,e,u }; }
function gSub(lv){ const [t,e,u]=pick(T_SUB);
  let a,b;
  if(lv===1){ a=R(4,10); b=R(2,a-2); }
  else if(lv===2){ a=R(12,18); b=R(2,a%10); if(a-b<2) return null; }
  else { a=R(11,18); b=R(a%10+1,9); if(a-b<2||a-b>9) return null; }
  return { kind:'sub', text:t.replace('{a}',a).replace('{b}',b), ans:a-b,
           eq:`${a}－${b}＝${a-b}`, a,b,e,u }; }
function gAdd2(lv){ const [t,e,u]=pick(T_ADD2);
  const a=R(3,6),b=R(2,4),c=R(2,4);
  if(lv<=1&&a+b+c>10) return null;
  return { kind:'add2', text:t.replace('{a}',a).replace('{b}',b).replace('{c}',c), ans:a+b+c,
           eq:`${a}＋${b}＋${c}＝${a+b+c}`, a,b,c,e,u }; }
function gSub2(lv){ const [t,e,u]=pick(T_SUB2);
  let a,b,c;
  if(lv<=1){ a=R(8,10); b=R(2,3); c=R(2,Math.max(2,a-b-2)); if(a-b-c<1) return null; }
  else { a=R(14,18); b=R(3,5); c=R(2,5); if(a-b-c<2) return null; }
  return { kind:'sub2', text:t.replace('{a}',a).replace('{b}',b).replace('{c}',c), ans:a-b-c,
           eq:`${a}－${b}－${c}＝${a-b-c}`, a,b,c,e,u }; }
function gOrd(){ const n=R(5,7), row=[]; const pool=[...FRUITS];
  for(let i=0;i<n;i++) row.push(pool.splice(R(0,pool.length-1),1)[0]);
  const k=R(2,n);
  return { kind:'ord', text:`上面一排水果，从左往右数，第 ${k} 个是什么？它前面有几个水果？`,
           ans:null, textAns:`第 ${k} 个是${row[k-1][1]}，前面有 ${k-1} 个`, k, row }; }

/* 组卷：10 题，随机混合 */
function makeQuiz(lv){ const out=[],used=new Set();
  let guard=0;
  while(out.length<10&&guard++<600){
    let q=null;
    const roll=Math.random();
    if(lv===0){ const L=R(1,3);
      q = roll<.4?gAdd(L):roll<.65?gSub(L):roll<.8?gAdd2(L):roll<.92?gSub2(L):gOrd(); }
    else { q = roll<.42?gAdd(lv):roll<.68?gSub(lv):roll<.84?gAdd2(lv):roll<.94?gSub2(lv):gOrd(); }
    if(!q) continue;
    const key=(q.a??'')+','+(q.b??'')+','+(q.c??'');
    if(used.has(key)) continue; used.add(key); out.push(q); }
  if(EXT){ const arr=Array.isArray(EXT)?EXT:(EXT['题目']||EXT['试卷']||[]); if(arr.length) return arr.slice(0,10); }
  return out; }

/* ================= 场景动画 ================= */
function em(el,e,i,delay){ const s=document.createElement('span'); s.className='em idle';
  s.textContent=e; s.style.animationDelay=delay+'ms, '+(delay+500)+'ms'; s.dataset.i=i;
  el.appendChild(s); return s; }
function op(el,o,delay){ const s=document.createElement('span'); s.className='op'; s.textContent=o;
  s.style.animationDelay=delay+'ms'; el.appendChild(s); }

function renderScene(q){ const sc=document.getElementById('scene'); sc.innerHTML='';
  if(q.kind==='add'){ const r=document.createElement('div'); r.className='row'; sc.appendChild(r);
    const els=[]; for(let i=0;i<q.a;i++) els.push(em(r,q.e,i,120+i*140));
    op(r,'＋',120+q.a*140); for(let i=0;i<q.b;i++) els.push(em(r,q.e,q.a+i,240+q.a*140+i*140));
    const br=document.createElement('div'); br.className='brace'; sc.appendChild(br);
    const c=document.createElement('div'); c.className='cap q'; c.textContent='？'+q.u; sc.appendChild(c);
  } else if(q.kind==='sub'){ const c=document.createElement('div'); c.className='cap';
    c.textContent=q.a+' '+q.u; sc.appendChild(c);
    const r=document.createElement('div'); r.className='row'; sc.appendChild(r);
    const els=[]; for(let i=0;i<q.a;i++) els.push(em(r,q.e,i,100+i*90));
    q.els=els; q.goneFrom=q.a-q.b;
  } else if(q.kind==='add2'){ const r=document.createElement('div'); r.className='row'; sc.appendChild(r);
    let d=100; for(let i=0;i<q.a;i++){ em(r,q.e,i,d); d+=130; } op(r,'＋',d); d+=120;
    for(let i=0;i<q.b;i++){ em(r,q.e,100+i,d); d+=130; } op(r,'＋',d); d+=120;
    for(let i=0;i<q.c;i++){ em(r,q.e,200+i,d); d+=130; }
    const br=document.createElement('div'); br.className='brace'; sc.appendChild(br);
    const c=document.createElement('div'); c.className='cap q'; c.textContent='？'+q.u; sc.appendChild(c);
  } else if(q.kind==='sub2'){ const c=document.createElement('div'); c.className='cap';
    c.textContent=q.a+' '+q.u; sc.appendChild(c);
    const r=document.createElement('div'); r.className='row'; sc.appendChild(r);
    const els=[]; for(let i=0;i<q.a;i++) els.push(em(r,q.e,i,80+i*80));
    q.els=els; q.goneFrom=q.a-q.b-q.c; q.gone1=q.b; 
  } else if(q.kind==='ord'){ const r=document.createElement('div'); r.className='row'; sc.appendChild(r);
    q.els=row=>{}; const els=[]; row.forEach((f,i)=>els.push(em(r,f[0],i,120+i*150))); q.els=els; }
}

/* ================= 流程 ================= */
let quiz=[],idx=0,score=0,answered=false,lv=1;
const $=id=>document.getElementById(id);

function loadQ(){ answered=false; const q=quiz[idx];
  $('qno').textContent='第 '+(idx+1)+' 题';
  $('qtext').innerHTML=q.text.replace(/(\d+)/g,'<b>$1</b>');
  $('eq').textContent=''; $('eq').className='eqshow';
  $('vd').textContent=''; $('vd').className='verdict';
  $('inp').value=''; $('inp').className=''; $('inp').disabled=false;
  $('okBtn').style.display=''; $('nxBtn').style.display='none';
  $('cur').textContent=idx+1;
  renderScene(q);
  setTimeout(()=>speak(q.text), 700);
}

function highlightCount(q){ /* 检查后回放点数高亮 */
  const scene=$('scene');
  const ems=scene.querySelectorAll('.em');
  let i=0;
  const tick=()=>{ if(i>0) ems[i-1].classList.remove('lit');
    if(i>=ems.length){ return; }
    ems[i].classList.add('lit'); i++; setTimeout(tick,240); };
  if(ems.length) setTimeout(tick,300);
}

function check(){ if(answered) return; const q=quiz[idx];
  const v=$('inp').value.trim();
  if(v===''){ $('inp').focus(); return; }
  answered=true;
  if(q.kind==='ord'){
    const ok=(v===q.textAns||v===String(q.k));
    if(ok){ score+=10; $('sc').textContent=score; confetti(); speak(pick(PRAISE));
      $('vd').textContent='✔ 答对啦！'; $('vd').className='verdict good';
      $('eq').textContent=q.textAns; $('eq').classList.add('show');
    } else { $('card').classList.add('shake'); setTimeout(()=>$('card').classList.remove('shake'),500);
      speak(q.textAns); $('vd').textContent='✘ 再看看哦'; $('vd').className='verdict bad';
      $('eq').textContent='正确答案：'+q.textAns; $('eq').classList.add('show'); }
    finish(); return;
  }
  const ok=parseInt(v,10)===q.ans;
  if(q.kind==='sub'||q.kind==='sub2'){ /* 动画划走 */
    const ems=q.els||[]; let t=400;
    const go=(from,n)=>{ for(let i=from;i<from+n;i++){ setTimeout(()=>{ ems[i]&&(ems[i].classList.add('gone')); speak2(i); },t); t+=260; } };
    function speak2(i){}
    if(q.kind==='sub') go(q.goneFrom,q.b); else { go(q.goneFrom,q.b); go(q.goneFrom+q.b,q.c); }
  }
  if(ok){ score+=10; $('sc').textContent=score; $('inp').className='ok'; $('inp').disabled=true;
    confetti(); speak(pick(PRAISE));
    $('vd').textContent='✔ 答对啦！+10 分'; $('vd').className='verdict good';
    $('eq').textContent=q.eq; $('eq').classList.add('show');
    highlightCount(q);
  } else { $('inp').className='no'; $('inp').disabled=true;
    $('card').classList.add('shake'); setTimeout(()=>$('card').classList.remove('shake'),500);
    speak(pick(CHEER));
    $('vd').textContent='✘ 正确答案是 '+q.ans; $('vd').className='verdict bad';
    $('eq').textContent=q.eq; $('eq').classList.add('show');
    highlightCount(q);
  }
  finish();
}
function finish(){ $('okBtn').style.display='none';
  $('nxBtn').style.display=''; $('nxBtn').textContent=(idx===quiz.length-1)?'看成绩 🏁':'下一题 ▶'; }

function next(){ idx++;
  if(idx>=quiz.length){ const stars=score>=90?'🌟🌟🌟':score>=60?'🌟🌟':'🌟';
    $('card').innerHTML=`<div class="done"><div class="medal">🏅</div>
      <h2>闯关完成！得分 ${score} 分</h2><div class="stars">${stars}</div>
      <p>答对 ${score/10} / 10 题 · 换个难度再来挑战吧！</p>
      <button class="btn bigbtn" onclick="restart()">🔄 再来一轮</button>
      <button class="btn bigbtn next" onclick="location.href='口算动画课堂.html'">🏠 返回动画课堂</button>
    </div>`; confetti(40);
    speak(`闯关完成！你得了${score}分，真棒！`); return; }
  loadQ(); }

function restart(){ score=0; idx=0; $('sc').textContent=0;
  $('card').innerHTML=`<div class="qno" id="qno"></div><div class="qtext" id="qtext"></div>
    <div class="tag">👆 先听题目，再看图说一说，最后填答案</div>
    <div class="scene" id="scene"></div>
    <div class="answer"><input id="inp" type="number" inputmode="numeric" placeholder="？" autocomplete="off">
    <button class="btn bigbtn" id="okBtn">✔ 检查</button>
    <button class="btn bigbtn next" id="nxBtn" style="display:none">下一题 ▶</button></div>
    <div class="eqshow" id="eq"></div><div class="verdict" id="vd"></div>`;
  $('okBtn').onclick=check; $('nxBtn').onclick=next; loadQ(); }

document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); lv=+b.dataset.lv; restart(); });
$('okBtn').onclick=check; $('nxBtn').onclick=next;
$('spkBtn').onclick=()=>{ const q=quiz[idx]; if(q) speak(q.text); };
$('inp').addEventListener('keydown',e=>{ if(e.key==='Enter'){ answered?next():check(); } });

quiz=makeQuiz(lv); loadQ();
</script>
</body>
</html>
