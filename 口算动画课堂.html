<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>口算动画课堂 - 一年级趣味学习乐园</title>
<link rel="stylesheet" href="assets/css/base/reset.css">
<link rel="stylesheet" href="assets/css/base/layout.css">
<link rel="stylesheet" href="assets/css/components/ui.css">
<link rel="stylesheet" href="assets/css/components/abacus.css">
<link rel="stylesheet" href="assets/css/compat.css">
<script>
(function () {
  var h = document.documentElement;
  var d = document.createElement('div').style;
  if (!('flexWrap' in d) && !('WebkitFlexWrap' in d)) h.className += ' no-flex';
  if (typeof Promise === 'undefined' || typeof Function.prototype.bind === 'undefined') h.className += ' old-kernel';
})();
</script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="emj">🧮</span>口算动画课堂</div>
    <a class="btn spk" href="主页.html">🏠 主页</a>
  </div>

  <nav class="nav">
    <a href="主页.html"><span class="emj">🏠</span>主页</a>
    <a class="active" href="口算动画课堂.html"><span class="emj">🧮</span>口算</a>
    <a href="看图学应用.html"><span class="emj">🍎</span>看图应用</a>
    <a href="数学测试卷.html"><span class="emj">📝</span>数学</a>
    <a href="语文测试卷.html"><span class="emj">🔤</span>语文</a>
    <a href="成长小课堂.html"><span class="emj">🛡️</span>成长</a>
    <a href="语文学习.html"><span class="emj">📚</span>语文学习</a>
    <a href="巩固练习.html"><span class="emj">🎯</span>巩固</a>
  </nav>

  <div class="page-title">🧮 口算动画课堂</div>
  <div class="page-sub">选一选，点“开始”，看小动物帮你算！</div>

  <div class="card ab-stage">
    <div class="ab-controls">
      <div class="ab-group">
        <span class="lab">选择运算</span>
        <div class="modebar">
          <button class="mbtn on" id="m-add">加法</button>
          <button class="mbtn" id="m-sub">减法</button>
          <button class="mbtn" id="m-carry">凑十法</button>
          <button class="mbtn" id="m-mul">乘法</button>
          <button class="mbtn" id="m-div">除法</button>
          <button class="mbtn" id="m-mixed">混合</button>
        </div>
      </div>

      <div class="ab-group">
        <span class="lab">数字（数1 / 数2）</span>
        <div class="numctrl"><button id="a-minus">－</button><span class="val" id="a-val">3</span><button id="a-plus">＋</button></div>
        <div class="numctrl"><button id="b-minus">－</button><span class="val" id="b-val">2</span><button id="b-plus">＋</button></div>
      </div>

      <div class="ab-group">
        <span class="lab">图形</span>
        <div class="emo-row" id="emo"></div>
      </div>

      <div class="ab-group">
        <span class="lab">播放</span>
        <div class="playbar">
          <button class="btn bigbtn" id="btn-play"><span id="t-play">开始</span></button>
          <button class="btn" id="btn-replay">🔄 重播</button>
          <button class="btn spk on" id="btn-voice">🔊 语音</button>
          <button class="btn spk on" id="btn-sfx">🎵 音效</button>
          <select class="speedsel" id="speed">
            <option value="1.6">慢</option>
            <option value="1" selected>正常</option>
            <option value="0.6">快</option>
          </select>
        </div>
      </div>
      <div id="t-hint" class="hint"></div>
    </div>

    <div id="say"></div>
    <div id="steps"></div>
    <div id="topLabel"></div>
    <div id="row"></div>
    <div id="braceWrap"><svg width="220" height="20" viewBox="0 0 220 20"><path id="bracePath" d="M12,2 L12,16 Q110,26 208,16 L208,2"></path></svg></div>
    <div id="qlabel" class="q"></div>
    <div class="eqbar">
      <span class="e-a" id="e-a">3</span>
      <span class="e-op" id="e-op">＋</span>
      <span class="e-b" id="e-b">2</span>
      <span>=</span>
      <span class="e-ans" id="e-ans">?</span>
    </div>
  </div>

  <div class="footer">加法·减法·凑十法·乘法·除法·混合，全部用可爱动画演示</div>
</div>

<script src="assets/js/core/compat.js"></script>
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/utils.js"></script>
<script src="assets/js/features/images.js"></script>
<script src="assets/js/features/speech.js"></script>
<script src="assets/js/features/banks.js"></script>
<script src="assets/js/features/content-problems.js"></script>
<script src="assets/js/features/content-math.js"></script>
<script src="assets/js/features/content-chinese.js"></script>
<script src="assets/js/features/content-chinese-learn.js"></script>
<script src="assets/js/features/content-social.js"></script>
<script src="assets/js/features/abacus.js"></script>
<script src="assets/js/pages/abacus-page.js"></script>
</body>
</html>
