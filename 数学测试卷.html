<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学测试卷 · 一年级上册</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
         background: linear-gradient(160deg,#ffe3ec 0%,#fff7d6 50%,#d9f2ff 100%);
         color: #333; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .sun { position: absolute; top: 5%; left: 6%; font-size: 48px; animation: spin 30s linear infinite; }
  .cloud { position: absolute; font-size: 32px; opacity: .8; animation: drift linear infinite; }
  .c1 { top: 12%; animation-duration: 50s; }
  .c2 { top: 30%; font-size: 24px; animation-duration: 66s; animation-delay: -30s; }
  .grass { position: fixed; left:0; right:0; bottom:0; height:30px; font-size:20px; line-height:30px;
           white-space:nowrap; overflow:hidden; z-index:0; opacity:.85; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift { from { left:-8%; } to { left:108%; } }

  header { z-index:2; width:100%; max-width:920px; padding:12px 16px 4px; display:flex;
           align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:22px; color:#d3548e; letter-spacing:2px; text-shadow:0 2px 0 #fff; flex:1; }
  .btn { border:none; border-radius:999px; padding:8px 16px; font-size:14px; cursor:pointer;
         font-family:inherit; color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.15); transition:transform .15s; }
  .btn:active { transform:translateY(2px); box-shadow:none; }
  .btn.home { background:linear-gradient(#8ec5ff,#5a9ee8); }
  .btn.spk { background:linear-gradient(#ffd36e,#f5a623); }
  .score { background:#fff; border-radius:999px; padding:6px 14px; font-size:14px; font-weight:700;
           color:#d3548e; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .prog { font-size:13px; color:#555; background:#ffffffaa; padding:6px 12px; border-radius:999px; }

  .stage { z-index:2; width:100%; max-width:920px; flex:1; padding:6px 16px 80px; }
  .card { background:rgba(255,255,255,.94); border-radius:22px; box-shadow:0 10px 30px rgba(200,90,140,.16);
          padding:22px 24px 20px; margin:0 auto; max-width:620px;
          animation:cardIn .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes cardIn { from { transform:translateY(50px) scale(.9); opacity:0; } }
  .card.shake { animation:shake .45s; }
  @keyframes shake { 20%,60% { transform:translateX(-9px);} 40%,80% { transform:translateX(9px);} }
  .qno { display:inline-block; background:#ffd9e8; color:#b13a6e; font-weight:700; font-size:12px;
         border-radius:999px; padding:3px 12px; margin-bottom:10px; }
  .qtext { font-size:19px; line-height:1.7; margin-bottom:8px; }
  .qtext b { color:#e74c3c; font-size:21px; }
  .scene { min-height:110px; display:flex; flex-direction:column; justify-content:center;
           align-items:center; gap:6px; margin:6px 0; }
  .row { display:flex; flex-wrap:wrap; justify-content:center; gap:2px; }
  .em { font-size:30px; display:inline-block; animation:drop .45s cubic-bezier(.2,1.6,.4,1); }
  .em.gone { filter:grayscale(1); opacity:.45; transform:scale(.85); }
  @keyframes drop { from { transform:translateY(-60px) scale(.3); opacity:0; } }
  .op { font-size:26px; font-weight:900; color:#e74c3c; margin:0 6px; align-self:center; }

  .bigq { font-size:30px; font-weight:900; text-align:center; letter-spacing:3px; margin:10px 0;
          color:#444; font-family:"Cambria Math","Arial",sans-serif; }
  .bigq .circ { display:inline-flex; width:44px; height:44px; border:3px solid #d3548e; border-radius:50%;
                align-items:center; justify-content:center; color:#d3548e; font-size:20px;
                animation:pop .5s .3s backwards; }
  @keyframes pop { 50% { transform:scale(1.25); } }

  .answer { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .answer input { width:96px; height:46px; font-size:24px; text-align:center; border:3px solid #f2a7c3;
                  border-radius:12px; font-weight:700; color:#b13a6e; outline:none; }
  .answer input:focus { border-color:#f5a623; box-shadow:0 0 0 4px #ffe9c2; }
  .answer input.ok { border-color:#2ecc71; background:#eafff2; }
  .answer input.no { border-color:#e74c3c; background:#ffefef; animation:shake .4s; }
  .cmpbtns { display:flex; gap:14px; }
  .cmpbtns button { width:64px; height:56px; font-size:26px; font-weight:900; border:3px solid #f2a7c3;
                    border-radius:14px; background:#fff; color:#d3548e; cursor:pointer; font-family:inherit; }
  .cmpbtns button:hover { background:#fff0f6; }
  .bigbtn { font-size:17px; padding:11px 34px; background:linear-gradient(#5fd68a,#2eaf62); }
  .bigbtn.next { background:linear-gradient(#7db9ff,#3f8fe0); }
  .eqshow { font-size:20px; font-weight:900; color:#8e44ad; letter-spacing:2px; min-height:26px;
            margin-top:10px; text-align:center; }
  .eqshow.show { animation:pop .4s; }
  .verdict { text-align:center; font-size:19px; font-weight:900; min-height:28px; margin-top:6px; }
  .verdict.good { color:#27ae60; animation:pop .4s; }
  .verdict.bad { color:#e74c3c; }
  .ctr { text-align:center; margin-top:8px; }

  .done { text-align:center; padding:40px 20px; }
  .done .medal { font-size:70px; animation:pop .6s; }
  .done h2 { color:#d3548e; margin:10px 0; }
  .done p { color:#666; margin-bottom:18px; }
  .confetti { position:fixed; top:-30px; z-index:99; font-size:22px; pointer-events:none;
              animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); opacity:.8; } }
</style>
</head>
<body>
<div class="sky"><div class="sun">🌞</div><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div></div>
<div class="grass">🌿🌸🌿🌼🌿🌷🌿🌸🌿🌿🌼🌿🌷🌿🌸🌿🌿🌼🌿🌷🌿🌸🌿🌼</div>

<header>
  <h1>📝 数学测试卷</h1>
  <span class="score">⭐ <span id="sc">0</span> 分</span>
  <span class="prog">第 <span id="cur">1</span> / 12 题</span>
  <button class="btn spk" id="spkBtn">🔊 朗读题目</button>
  <button class="btn home" onclick="location.href='主页.html'">🏠 主页</button>
  <button class="btn home" onclick="location.href='口算动画课堂.html'">🎬 动画课堂</button>
</header>

<div class="stage"><div class="card" id="card">
  <div class="qno" id="qno"></div>
  <div class="qtext" id="qtext"></div>
  <div class="scene" id="scene"></div>
  <div id="ansarea"></div>
  <div class="eqshow" id="eq"></div>
  <div class="verdict" id="vd"></div>
</div></div>

<script>
/* AJAX：优先加载外部题库 */
let EXT=null; fetch('./题库/数学测试卷.json').then(r=>r.ok?r.json():Promise.reject()).then(j=>{EXT=j;}).catch(()=>{});

let voice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>v.lang.startsWith('zh')&&/Xiaoxiao|Yunxi|Huihui/.test(v.name))||vs.find(v=>v.lang.startsWith('zh'))||null; }
pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,''));
  u.lang='zh-CN'; if(voice)u.voice=voice; u.rate=.95; u.pitch=1.15; speechSynthesis.speak(u);}catch(e){} }
function confetti(n=26){ const es=['🎉','⭐','🌟','✨','🎊'];
  for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='confetti';
    d.textContent=es[Math.random()*es.length|0]; d.style.left=Math.random()*100+'vw';
    d.style.animationDuration=(1.6+Math.random()*1.6)+'s'; d.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),3800);} }

const R=(x,y)=>Math.floor(Math.random()*(y-x+1))+x;
const pick=a=>a[Math.random()*a.length|0];
const PRAISE=["答对啦，真棒！","太厉害了！","完全正确！","你真是数学小能手！"];
const CHEER=["没关系，再想一想哦。","差一点点，加油！"];

/* ---------- 题型生成（均返回 {type, say, html, scene?, ans, cmp?, eq}） ---------- */
function qKouSuan(){ // 口算
  if(Math.random()<.65){ const a=R(2,8),b=R(1,9-a); if(Math.random()<.5)
      return {type:'n',tag:'口算',say:`${a} 加 ${b} 等于几？`,html:`<div class="bigq">${a} ＋ ${b} ＝ ？</div>`,ans:a+b,eq:`${a}＋${b}＝${a+b}`};
    const c=a+b; return {type:'n',tag:'口算',say:`${c} 减 ${b} 等于几？`,html:`<div class="bigq">${c} － ${b} ＝ ？</div>`,ans:a,eq:`${c}－${b}＝${a}`}; }
  const a=R(6,9),b=R(3,9); // 20以内进位加
  return {type:'n',tag:'口算',say:`${a} 加 ${b} 等于几？`,html:`<div class="bigq">${a} ＋ ${b} ＝ ？</div>`,ans:a+b,eq:`${a}＋${b}＝${a+b}（凑十：先凑成10）`}; }
function qBi(){ // 比大小
  const mk=()=>{ const a=R(3,10),b=R(3,10); return [a,b]; };
  let a,b,mode=Math.random();
  if(mode<.5){ [a,b]=mk(); }
  else if(mode<.8){ const x=R(2,5),y=R(1,4); a=x+y; b=R(4,10); }
  else { const x=R(5,10),y=R(2,4); a=x-y; b=R(1,9); }
  const cmp=a>b?'>':a<b?'<':'=';
  return {type:'cmp',tag:'比大小',say:`比较大小：${a} 和 ${b}，填大于号、小于号还是等于号？`,
    html:`<div class="bigq">${a} <span class="circ">？</span> ${b}</div>`,cmp,eq:`${a} ${cmp} ${b}`}; }
function qPic(){ // 看图列式
  const e=pick(['🍎','🐦','🌸','🍓','🍬','🐟']);
  const add=Math.random()<.5;
  if(add){ const a=R(2,6),b=R(2,6);
    return {type:'n',tag:'看图列式',
      say:`看图：${a} 加 ${b} 等于几？`,
      html:`<div class="bigq">？ ＝ <span style="font-size:22px">□ ＋ □</span></div>`,
      scene:[['add',e,a,b]],ans:a+b,eq:`${a}＋${b}＝${a+b}`}; }
  const a=R(5,10),b=R(2,a-2);
  return {type:'n',tag:'看图列式',say:`看图：一共有 ${a} 个，划走了 ${b} 个，还剩几个？`,
    html:`<div class="bigq">？ ＝ <span style="font-size:22px">□ － □</span></div>`,
    scene:[['sub',e,a,b]],ans:a-b,eq:`${a}－${b}＝${a-b}`}; }
function qFill(){ // 填空
  const kind=R(1,4);
  if(kind===1){ const n=R(3,9);
    return {type:'n',tag:'填空',say:`按顺序填数：${n}、${n+1}、几、${n+3}？`,html:`<div class="bigq">${n}、${n+1}、（？）、${n+3}</div>`,ans:n+2,eq:`${n}、${n+1}、${n+2}、${n+3}`}; }
  if(kind===2){ const a=R(1,9),b=R(1,9);
    return {type:'n',tag:'填空',say:`${a} 和 ${b} 合起来是几？`,html:`<div class="bigq">${a} 和 ${b} 合起来是（？）</div>`,ans:a+b,eq:`${a}＋${b}＝${a+b}`}; }
  if(kind===3){ const t=R(1,1),o=R(1,9); const n=t*10+o;
    return {type:'n',tag:'填空',say:`${n} 里面有 ${t} 个十和几个一？`,html:`<div class="bigq">${n} 里面有 ${t} 个十和（？）个一</div>`,ans:o,eq:`${n}＝${t}个十＋${o}个一`}; }
  const m=R(5,9);
  return {type:'n',tag:'填空',say:`比 ${m} 大、比 ${m+2} 小的数是几？`,html:`<div class="bigq">比 ${m} 大、比 ${m+2} 小的数是（？）</div>`,ans:m+1,eq:`${m}＜${m+1}＜${m+2}`}; }
function qWord(){ // 解决问题
  const tpl=pick([
    {t:(a,b)=>`树上有 ${a} 只小鸟，飞走了 ${b} 只，树上还剩几只？`,e:'🐦',op:'-',u:'只'},
    {t:(a,b)=>`盘子里有 ${a} 个草莓，小明吃了 ${b} 个，还剩几个？`,e:'🍓',op:'-',u:'个'},
    {t:(a,b)=>`花坛左边有 ${a} 朵红花，右边有 ${b} 朵黄花，一共有多少朵花？`,e:'🌸',op:'+',u:'朵'},
    {t:(a,b)=>`停车场有 ${a} 辆车，又开来 ${b} 辆，一共有多少辆？`,e:'🚗',op:'+',u:'辆'}]);
  let a,b;
  if(tpl.op==='-'){ a=R(6,10); b=R(2,a-2); } else { a=R(2,6); b=R(2,6); }
  const ans=tpl.op==='-'?a-b:a+b;
  return {type:'n',tag:'解决问题',say:tpl.t(a,b),html:`<div class="qtext" style="text-align:center">${tpl.t(a,b)}</div>`,
    scene:[[tpl.op==='-'?'sub':'add',tpl.e,a,b]],ans,eq:`${a}${tpl.op==='-'?'－':'＋'}${b}＝${ans}（${tpl.u}）`}; }
function qThink(){ // 思考题
  if(Math.random()<.5){ const st=pick([[1,3,5,7],[2,4,6,8],[5,10,15,20]]); const d=st[1]-st[0];
    const nx1=st[3]+d,nx2=st[3]+2*d;
    return {type:'n',tag:'思考题',say:`找规律填数：${st.join('、')}，接下来填几？`,
      html:`<div class="bigq">${st.join('、')}、（？）、（？）</div>`,ans:nx1,eq:`规律：每次加 ${d} → ${nx1}、${nx2}`}; }
  const k=R(3,5),m=R(2,4),n=k+m-1;
  return {type:'n',tag:'思考题',say:`小朋友排队，从前面数小明排第 ${k} 个，从后面数排第 ${m} 个，这一队一共有多少人？`,
    html:`<div class="qtext" style="text-align:center">小朋友排队，从前面数小明排第 <b>${k}</b> 个，从后面数排第 <b>${m}</b> 个，一共有几人？</div>`,
    scene:[['line',k,m]],ans:n,eq:`${k}＋${m}－1＝${n}（人）`}; }

const GENS=[qKouSuan,qKouSuan,qBi,qPic,qFill,qWord,qWord,qThink];
function makeQuiz(){ if(EXT){ const arr=Array.isArray(EXT)?EXT:(EXT['试卷']||[]); if(arr.length) return arr.slice(0,12); }
  const out=[],used=new Set(); let g=0;
  while(out.length<12&&g++<400){ const q=pick(GENS)(); if(!q) continue;
    const key=q.say; if(used.has(key)) continue; used.add(key); out.push(q); }
  return out; }

/* ---------- 场景渲染 ---------- */
function renderScene(sc){ const el=document.getElementById('scene'); el.innerHTML='';
  if(!sc) return; const [kind,e,a,b]=sc[0]; const row=document.createElement('div'); row.className='row';
  if(kind==='add'||kind==='sub'){
    if(kind==='add'){ for(let i=0;i<a;i++){ const s=document.createElement('span'); s.className='em'; s.textContent=e; s.style.animationDelay=(i*120)+'ms'; row.appendChild(s);} 
      const o=document.createElement('span'); o.className='op'; o.textContent='＋'; row.appendChild(o);
      for(let i=0;i<b;i++){ const s=document.createElement('span'); s.className='em'; s.textContent=e; s.style.animationDelay=((a+i)*120)+'ms'; row.appendChild(s);} }
    else { for(let i=0;i<a;i++){ const s=document.createElement('span'); s.className='em'; s.textContent=e; s.style.animationDelay=(i*110)+'ms'; if(i>=a-b) s.classList.add('gone'); row.appendChild(s);} }
    el.appendChild(row); }
  else if(kind==='line'){ const k=sc[1],m=sc[2],n=k+m-1;
    for(let i=1;i<=n;i++){ const s=document.createElement('span'); s.className='em';
      s.textContent=i===k?'🧑':'🧒'; s.style.animationDelay=(i*120)+'ms';
      if(i===k){ s.style.filter='drop-shadow(0 0 8px gold)'; s.style.transform='scale(1.3)'; }
      el.appendChild(s); if(i<n) el.appendChild(document.createTextNode(' ')); }
    const c=document.createElement('div'); c.style.cssText='font-size:13px;color:#888;margin-top:6px';
    c.textContent='👆 红圈里是小明'; el.appendChild(c); }
}

/* ---------- 流程 ---------- */
let quiz=[],idx=0,score=0,answered=false;
const $=id=>document.getElementById(id);

function loadQ(){ answered=false; const q=quiz[idx];
  $('qno').textContent='第 '+(idx+1)+' 题 · '+q.tag;
  $('qtext').innerHTML=q.html;
  $('eq').textContent=''; $('eq').className='eqshow';
  $('vd').textContent=''; $('vd').className='verdict';
  renderScene(q.scene);
  const aa=$('ansarea'); aa.innerHTML='';
  if(q.type==='n'){ aa.innerHTML=`<div class="answer"><input id="inp" type="number" inputmode="numeric" placeholder="？" autocomplete="off">
    <button class="btn bigbtn" id="okBtn">✔ 检查</button>
    <button class="btn bigbtn next" id="nxBtn" style="display:none">下一题 ▶</button></div>`;
    $('okBtn').onclick=check; $('nxBtn').onclick=next; $('inp').addEventListener('keydown',e=>{if(e.key==='Enter')answered?next():check();});
    setTimeout(()=>$('inp').focus(),500); }
  else { aa.innerHTML=`<div class="answer"><div class="cmpbtns">
      <button data-v=">">＞</button><button data-v="<">＜</button><button data-v="=">＝</button></div>
      <button class="btn bigbtn next" id="nxBtn" style="display:none">下一题 ▶</button></div>`;
    aa.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ if(!answered) doCmp(b.dataset.v,b); });
    $('nxBtn').onclick=next; }
  $('cur').textContent=idx+1;
  setTimeout(()=>speak(q.say),700);
}

function showResult(q,ok,extra){ answered=true;
  if(ok){ score+=10; $('sc').textContent=score; confetti(); speak(pick(PRAISE));
    $('vd').textContent='✔ 答对啦！+10 分'; $('vd').className='verdict good'; }
  else { $('card').classList.add('shake'); setTimeout(()=>$('card').classList.remove('shake'),500);
    speak(pick(CHEER)); $('vd').textContent='✘ 正确答案：'+extra; $('vd').className='verdict bad'; }
  $('eq').textContent=q.eq; $('eq').classList.add('show');
  const okB=$('okBtn'); if(okB) okB.style.display='none';
  const nx=$('nxBtn'); if(nx){ nx.style.display=''; nx.textContent=(idx===quiz.length-1)?'看成绩 🏁':'下一题 ▶'; } }

function check(){ if(answered) return; const q=quiz[idx]; const v=$('inp').value.trim();
  if(v==='') return; const ok=parseInt(v,10)===q.ans;
  if(ok){ $('inp').className='ok'; } else { $('inp').className='no'; }
  $('inp').disabled=true; showResult(q,ok,q.ans); }
function doCmp(v,btn){ if(answered) return; const q=quiz[idx]; const ok=v===q.cmp;
  btn.style.borderColor=ok?'#2ecc71':'#e74c3c'; btn.style.background=ok?'#eafff2':'#ffefef';
  showResult(q,ok,q.cmp); }
function next(){ idx++;
  if(idx>=quiz.length){ const stars=score>=100?'🌟🌟🌟':score>=60?'🌟🌟':'🌟';
    $('card').innerHTML=`<div class="done"><div class="medal">🏆</div>
      <h2>测试完成！得分 ${score} 分</h2><div class="stars" style="font-size:34px;letter-spacing:8px">${stars}</div>
      <p>共 12 题，答对 ${score/10} 题 · 再来一轮换个新卷子！</p>
      <button class="btn bigbtn" onclick="restart()">🔄 再测一次</button>
      <button class="btn bigbtn next" onclick="location.href='口算动画课堂.html'">🏠 返回动画课堂</button></div>`;
    confetti(40); speak(`测试完成！你得了${score}分，真棒！`); return; }
  loadQ(); }
function restart(){ score=0; idx=0; $('sc').textContent=0;
  quiz=makeQuiz(); loadQ(); }
$('spkBtn').onclick=()=>{ const q=quiz[idx]; if(q) speak(q.say); };

quiz=makeQuiz(); loadQ();
</script>
</body>
</html>
